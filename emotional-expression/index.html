<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語言練習 - 睿睿(情緒表達)</title>
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --text: #3A3532;
    --text-muted: #8A837B;
    --accent: #6FA8A0;
    --accent-bg: #E4F0EE;
    --success: #4C9A6E;
    --success-bg: #E4F3E9;
    --warning-text: #B5762E;
    --warning-bg: #FBEDE0;
    --border: #E4DED5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 48px;
  }
  .card { max-width: 480px; margin: 0 auto; text-align: center; }
  button {
    font-family: inherit; cursor: pointer;
    border: 2px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 16px;
  }
  button:active { transform: scale(0.98); }
  .optBtn { width: 100%; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 14px; border-radius: 999px;
    background: var(--accent-bg); color: var(--accent); font-size: 13px; margin-bottom: 1.25rem;
  }
</style>
</head>
<body>
<h1 style="font-size:1px;color:transparent;position:absolute;">睿睿的情緒表達語言練習(生氣為主)</h1>
<div id="app" class="card"></div>
<script>
const CHILD_ID = "ruirui";
const BANK = {
  basic: [
    { id:"emo-basic-1", cat:"情緒識別", prompt:"他皺眉頭、握拳頭,他現在感覺怎麼樣?", options:["生氣","開心"], correct:0 },
    { id:"emo-basic-2", cat:"情緒識別", prompt:"他笑咪咪、拍拍手,他現在感覺怎麼樣?", options:["開心","難過"], correct:0 },
    { id:"emo-basic-3", cat:"情緒識別", prompt:"他流眼淚、嘴巴往下彎,他現在感覺怎麼樣?", options:["難過","生氣"], correct:0 },
    { id:"emo-basic-4", cat:"情緒識別", prompt:"他大聲喊叫、用力踩地板,他現在感覺怎麼樣?", options:["生氣","難過"], correct:0 },
    { id:"emo-basic-5", cat:"情緒識別", prompt:"他蹦蹦跳跳、眼睛亮亮的,他現在感覺怎麼樣?", options:["開心","生氣"], correct:0 },
    { id:"emo-basic-6", cat:"情緒識別", prompt:"他低著頭不說話、肩膀垂下來,他現在感覺怎麼樣?", options:["難過","開心"], correct:0 },
    { id:"emo-basic-7", cat:"情緒表達", prompt:"生氣的時候,可以用什麼代替打人?", options:["說出來或深呼吸","打人"], correct:0 },
    { id:"emo-basic-8", cat:"情緒表達", prompt:"生氣的時候,手可以怎麼放?", options:["放在身體兩旁或抱住自己","揮拳頭打人"], correct:0 },
    { id:"emo-basic-9", cat:"情緒表達", prompt:"覺得快要生氣的時候,可以先做什麼?", options:["深呼吸","立刻尖叫"], correct:0 },
    { id:"emo-basic-10", cat:"情緒表達", prompt:"覺得難過的時候,可以怎麼做?", options:["告訴大人","自己躲起來不說"], correct:0 },
    { id:"emo-basic-11", cat:"情緒表達", prompt:"覺得很生氣,除了深呼吸,還可以抱著什麼讓自己冷靜?", options:["抱枕頭或娃娃","打旁邊的人"], correct:0 },
    { id:"emo-basic-12", cat:"情緒表達", prompt:"覺得快要生氣了,可以去哪裡讓自己冷靜?", options:["安靜的角落","衝去打人"], correct:0 },
    { id:"emo-basic-13", cat:"情緒表達", prompt:"覺得很生氣,除了說出來,還可以請誰幫忙?", options:["大人或老師","自己一直悶著"], correct:0 },
    { id:"emo-basic-14", cat:"情緒表達", prompt:"覺得難過,可以抱著什麼讓自己好一點?", options:["抱枕頭或娃娃","打旁邊的東西"], correct:0 },
    { id:"emo-basic-15", cat:"情緒表達", prompt:"覺得生氣的時候,可以喝一口什麼讓自己冷靜?", options:["水","一直尖叫"], correct:0 }
  ],
  mid: [
    { id:"emo-mid-1", cat:"情緒表達", prompt:"覺得很生氣,可以怎麼說?", options:["我很生氣","打人"], correct:0 },
    { id:"emo-mid-2", cat:"情緒表達", prompt:"玩具被拿走了,很生氣,可以怎麼說?", options:["那是我的玩具,請還給我","用力打人"], correct:0 },
    { id:"emo-mid-3", cat:"情緒表達", prompt:"事情不如自己想的,覺得很生氣,可以怎麼說?", options:["這讓我很生氣","用力摔東西"], correct:0 },
    { id:"emo-mid-4", cat:"情緒表達", prompt:"生氣的時候想要打人,可以先怎麼說?", options:["我現在很生氣,需要離開一下","直接動手"], correct:0 },
    { id:"emo-mid-5", cat:"情緒表達", prompt:"生氣快要爆炸的時候,可以先做什麼動作?", options:["深呼吸數到五","立刻打人"], correct:0 },
    { id:"emo-mid-6", cat:"情緒表達", prompt:"覺得快要生氣了,可以先怎麼說?", options:["我需要冷靜一下","打旁邊的人"], correct:0 },
    { id:"emo-mid-7", cat:"情緒表達", prompt:"覺得很開心,可以怎麼說?", options:["我好開心","我好生氣"], correct:0 },
    { id:"emo-mid-8", cat:"情緒表達", prompt:"得到想要的東西,很開心,可以怎麼說?", options:["謝謝,我好喜歡","生氣尖叫"], correct:0 },
    { id:"emo-mid-9", cat:"情緒表達", prompt:"覺得很難過,可以怎麼說?", options:["我好難過","我好開心"], correct:0 },
    { id:"emo-mid-10", cat:"情緒表達", prompt:"難過想哭的時候,可以怎麼說?", options:["我覺得難過,我需要抱抱","自己躲起來不說"], correct:0 },
    { id:"emo-mid-11", cat:"情緒表達", prompt:"覺得很生氣,除了說出來,還可以怎麼做讓自己冷靜?", options:["去安靜的角落待一下","衝過去推人"], correct:0 },
    { id:"emo-mid-12", cat:"情緒表達", prompt:"覺得快要生氣了,可以怎麼說,請大人幫忙?", options:["我需要幫忙冷靜一下","什麼都不說直接動手"], correct:0 },
    { id:"emo-mid-13", cat:"情緒表達", prompt:"覺得生氣的時候,可以怎麼用身體釋放力氣?", options:["用力跳一跳或抱緊枕頭","用力打人"], correct:0 },
    { id:"emo-mid-14", cat:"情緒表達", prompt:"覺得難過的時候,除了說出來,還可以怎麼做?", options:["抱著喜歡的娃娃休息一下","一直悶著不說"], correct:0 },
    { id:"emo-mid-15", cat:"情緒表達", prompt:"覺得生氣快要爆炸的時候,可以怎麼說,幫自己爭取時間冷靜?", options:["我可以先離開一下嗎","直接動手打人"], correct:0 }
  ],
  causal: [
    { id:"emo-causal-1", cat:"因果關係", prompt:"因為生氣就打人,所以會發生什麼事?", options:["別人會受傷、生氣或難過","大家會很開心"], correct:0 },
    { id:"emo-causal-2", cat:"因果關係", prompt:"因為生氣的時候先深呼吸,沒有打人,所以接下來會怎麼樣?", options:["心情慢慢平靜下來","還是一直生氣打人"], correct:0 },
    { id:"emo-causal-3", cat:"因果關係", prompt:"因為說出我很生氣,而不是打人,所以朋友會有什麼反應?", options:["願意繼續跟我玩","害怕不敢靠近我"], correct:0 },
    { id:"emo-causal-4", cat:"因果關係", prompt:"打人之後,老師會怎麼做?", options:["提醒我要用說的,不要用打的","稱讚我做得很好"], correct:0 },
    { id:"emo-causal-5", cat:"因果關係", prompt:"因為每次生氣都先數到十再說話,所以慢慢會怎麼樣?", options:["比較不容易打人","打人打得更用力"], correct:0 },
    { id:"emo-causal-6", cat:"因果關係", prompt:"因為生氣的時候先離開現場冷靜,所以打人的機會會怎麼樣?", options:["變少","變多"], correct:0 },
    { id:"emo-causal-7", cat:"因果關係", prompt:"因為學會用說的表達生氣,不再打人,所以心裡會覺得怎麼樣?", options:["比較有自信,比較不會後悔","覺得更委屈"], correct:0 },
    { id:"emo-causal-8", cat:"因果關係", prompt:"因為每次生氣都能用說的表達,所以老師會有什麼反應?", options:["覺得我進步了、更棒了","覺得我還是很難管教"], correct:0 },
    { id:"emo-causal-9", cat:"因果關係", prompt:"因為很開心地跟大家分享玩具,所以朋友會有什麼反應?", options:["更喜歡跟我玩","不想理我"], correct:0 },
    { id:"emo-causal-10", cat:"因果關係", prompt:"因為難過的時候說出我需要抱抱,所以家人會怎麼做?", options:["過來抱抱我、安慰我","什麼都不做"], correct:0 },
    { id:"emo-causal-11", cat:"因果關係", prompt:"因為生氣的時候去安靜角落待一下,所以還會不會打人?", options:["不會,先冷靜下來了","還是會馬上打人"], correct:0 },
    { id:"emo-causal-12", cat:"因果關係", prompt:"因為請大人幫忙一起冷靜,所以結果會怎麼樣?", options:["情緒慢慢穩定下來","情緒還是一直很失控"], correct:0 },
    { id:"emo-causal-13", cat:"因果關係", prompt:"因為生氣的時候抱緊枕頭而不是打人,所以旁邊的人會怎麼樣?", options:["不會受傷","還是會被打到"], correct:0 },
    { id:"emo-causal-14", cat:"因果關係", prompt:"因為用跳一跳的方式釋放生氣的力氣,所以最後手會不會打到別人?", options:["不會","會"], correct:0 },
    { id:"emo-causal-15", cat:"因果關係", prompt:"因為學會用很多不同的方法讓自己冷靜(深呼吸、喝水、離開現場),所以生氣時打人的次數會怎麼樣?", options:["慢慢變少","一直不變"], correct:0 }
  ]
};
const SESSION_LENGTH = 10;

const levelInfo = {
  basic: { label: "基礎", desc: "情緒辨識與簡單表達" },
  mid: { label: "中階", desc: "用語詞說出情緒" },
  causal: { label: "進階", desc: "情緒與行為的因果推理" }
};

let progress = { totalStars: 0, masteredIds: [], lastPlayed: null };
let level = null, questions = [], idx = 0, score = 0, answered = false, correctFlags = [];

async function loadProgress(){
  try {
    const res = await window.storage.get('progress:' + CHILD_ID);
    if(res && res.value) progress = JSON.parse(res.value);
  } catch(e) {}
}
async function saveProgress(){
  try {
    progress.lastPlayed = new Date().toISOString();
    await window.storage.set('progress:' + CHILD_ID, JSON.stringify(progress));
  } catch(e) {}
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleOptions(q){
  const order = shuffle(q.options.map((_,i) => i));
  return { ...q, options: order.map(i => q.options[i]), correct: order.indexOf(q.correct) };
}
function pickQuestions(lv){
  const pool = BANK[lv];
  const fresh = shuffle(pool.filter(q => progress.masteredIds.indexOf(q.id) === -1));
  let picked = fresh.slice(0, SESSION_LENGTH);
  if(picked.length < SESSION_LENGTH){
    const need = SESSION_LENGTH - picked.length;
    const already = new Set(picked.map(q => q.id));
    const rest = shuffle(pool.filter(q => !already.has(q.id))).slice(0, need);
    picked = picked.concat(rest);
  }
  return picked.slice(0, Math.min(SESSION_LENGTH, pool.length)).map(shuffleOptions);
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW'; u.rate = 0.85;
  const p = document.getElementById('promptText');
  if(p){ u.onstart = () => p.style.background = 'var(--accent-bg)'; u.onend = () => p.style.background = 'transparent'; }
  speechSynthesis.speak(u);
}

function renderLevelSelect(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <p style="font-size:16px; color:var(--text-muted); margin:16px 0 6px;">睿睿目前累積星星:${progress.totalStars} 顆</p>
    <p style="font-size:16px; margin:0 0 1.5rem;">選擇今天的練習難度(情緒表達:生氣為主)</p>
    <div style="display:flex; flex-direction:column; gap:12px;">
      ${Object.keys(levelInfo).map(k => `
        <button data-k="${k}" class="levelBtn" style="text-align:left; padding:16px 18px; display:flex; flex-direction:column; gap:2px;">
          <span style="font-size:17px; font-weight:600;">${levelInfo[k].label}</span>
          <span style="font-size:13px; color:var(--text-muted);">${levelInfo[k].desc}</span>
        </button>`).join('')}
    </div>`;
  document.querySelectorAll('.levelBtn').forEach(btn => {
    btn.onclick = () => {
      level = btn.dataset.k;
      questions = pickQuestions(level);
      idx = 0; score = 0; correctFlags = [];
      renderQuestion();
    };
  });
}

function starBadge(filled){
  return filled
    ? `<div style="width:34px;height:34px;border-radius:50%;background:var(--warning-bg);display:flex;align-items:center;justify-content:center;font-size:18px;">★</div>`
    : `<div style="width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--border);">★</div>`;
}

async function renderQuestion(){
  const app = document.getElementById('app');
  if(idx >= questions.length){
    questions.forEach((q,i) => { if(correctFlags[i] && progress.masteredIds.indexOf(q.id) === -1) progress.masteredIds.push(q.id); });
    progress.totalStars += score;
    await saveProgress();
    const ratio = score / questions.length;
    const msg = ratio === 1 ? "全部集滿了,你是語言小超人!"
      : ratio >= 0.6 ? "集了好多星星,你好棒!"
      : "又前進了一步,繼續加油!";
    app.innerHTML = `
      <p style="font-size:22px; font-weight:600; margin:2rem 0 4px;">睿睿的集點卡</p>
      <p style="font-size:15px; color:var(--text-muted); margin:0 0 20px;">${levelInfo[level].label}難度・累積總星數 ${progress.totalStars}</p>
      <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:0 0 20px;">
        ${correctFlags.map(f => starBadge(f)).join('')}
      </div>
      <p style="font-size:17px; font-weight:600; color:var(--warning-text); margin:0 0 24px;">${msg}</p>
      <div style="display:flex; gap:10px; justify-content:center; padding-bottom:2rem;">
        <button id="retry" style="padding:12px 22px; font-size:15px;">再玩一次</button>
        <button id="changeLevel" style="padding:12px 22px; font-size:15px;">換難度</button>
      </div>`;
    document.getElementById('retry').onclick = () => { questions = pickQuestions(level); idx = 0; score = 0; correctFlags = []; renderQuestion(); };
    document.getElementById('changeLevel').onclick = renderLevelSelect;
    return;
  }
  const q = questions[idx];
  answered = false;
  const dots = questions.map((_,i) => `<div style="width:10px;height:10px;border-radius:50%;background:${i<idx?'var(--accent)':i===idx?'var(--text)':'var(--border)'};"></div>`).join('');
  app.innerHTML = `
    <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin:1rem 0 0.75rem;">
      <span style="font-size:12px; color:var(--text-muted);">${levelInfo[level].label}難度</span>
      <span style="font-size:13px; font-weight:600; color:var(--warning-text);">★ ${score}</span>
    </div>
    <div style="display:flex; gap:6px; justify-content:center; margin-bottom:1.5rem;">${dots}</div>
    <div class="badge">${q.cat}</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:2rem;">
      <button id="speakBtn" aria-label="播放語音" style="width:48px; height:48px; border-radius:50%; padding:0; font-size:20px;">🔊</button>
      <p id="promptText" style="font-size:18px; font-weight:600; margin:0; padding:6px 10px; border-radius:6px; transition:background 0.2s;">${q.prompt}</p>
    </div>
    <div id="options" style="display:flex; flex-direction:column; gap:14px;">
      ${q.options.map((opt,i) => `<button data-i="${i}" class="optBtn" style="height:64px; font-size:18px;">${opt}</button>`).join('')}
    </div>
    <div id="feedback" style="min-height:32px; margin-top:1.25rem; font-size:16px; font-weight:600;"></div>
    <button id="nextBtn" style="margin-top:0.5rem; padding:10px 24px; font-size:15px; display:none;">下一題</button>
    <div style="height:2rem;"></div>`;

  document.getElementById('speakBtn').onclick = () => speak(q.prompt);
  document.querySelectorAll('.optBtn').forEach(btn => {
    btn.onclick = () => {
      if(answered) return;
      answered = true;
      const i = Number(btn.dataset.i);
      const fb = document.getElementById('feedback');
      const correctBtn = document.querySelectorAll('.optBtn')[q.correct];
      const isCorrect = i === q.correct;
      correctFlags.push(isCorrect);
      if(isCorrect){
        score++;
        btn.style.borderColor = 'var(--success)';
        btn.style.background = 'var(--success-bg)';
        fb.textContent = '答對了,獲得一顆星星!';
        fb.style.color = 'var(--success)';
        speak('答對了,獲得一顆星星!');
      } else {
        btn.style.borderColor = 'var(--warning-text)';
        correctBtn.style.borderColor = 'var(--success)';
        correctBtn.style.background = 'var(--success-bg)';
        fb.textContent = '再想一次也沒關係';
        fb.style.color = 'var(--warning-text)';
        speak('再想一次也沒關係');
      }
      document.getElementById('nextBtn').style.display = 'inline-block';
    };
  });
  document.getElementById('nextBtn').onclick = () => { idx++; renderQuestion(); };
  speak(q.prompt);
}

(async function init(){
  await loadProgress();
  renderLevelSelect();
})();
</script>
</body>
</html>
