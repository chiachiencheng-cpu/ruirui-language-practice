<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語言練習 - 睿睿(學校社交)</title>
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --text: #3A3532;
    --text-muted: #8A837B;
    --accent: #6FA8A0;
    --accent-bg: #E4F0EE;
    --success: #4C9A6E;
    --success-bg: #E4F3E9;
    --warning-text: #B5762E;
    --warning-bg: #FBEDE0;
    --border: #E4DED5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 48px;
  }
  .card { max-width: 480px; margin: 0 auto; text-align: center; }
  button {
    font-family: inherit; cursor: pointer;
    border: 2px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 16px;
  }
  button:active { transform: scale(0.98); }
  .optBtn { width: 100%; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 14px; border-radius: 999px;
    background: var(--accent-bg); color: var(--accent); font-size: 13px; margin-bottom: 1.25rem;
  }
</style>
</head>
<body>
<h1 style="font-size:1px;color:transparent;position:absolute;">睿睿的學校社交語言練習</h1>
<div id="app" class="card"></div>
<script>
const CHILD_ID = "ruirui";
const BANK = {
  basic: [
    { id:"school-basic-1", cat:"社交語用", prompt:"排隊的時候,要站在哪裡?", options:["最後面","最前面"], correct:0 },
    { id:"school-basic-2", cat:"社交語用", prompt:"老師說要坐好,你應該怎麼做?", options:["坐好","亂跑"], correct:0 },
    { id:"school-basic-3", cat:"情緒表達", prompt:"你不喜歡吵的聲音,你可以摀住什麼?", options:["耳朵","眼睛"], correct:0 },
    { id:"school-basic-4", cat:"社交語用", prompt:"同學跟你打招呼,你可以怎麼做?", options:["揮手說哈囉","轉頭不理"], correct:0 },
    { id:"school-basic-5", cat:"需求表達", prompt:"你想加入遊戲,可以先做什麼?", options:["舉手或說話","直接搶玩具"], correct:0 },
    { id:"school-basic-6", cat:"情緒表達", prompt:"你覺得不舒服,你可以說什麼?", options:["我不舒服","我要睡覺"], correct:0 },
    { id:"school-basic-7", cat:"社交語用", prompt:"下課鐘響了,大家要做什麼?", options:["排隊出去","繼續坐著"], correct:0 },
    { id:"school-basic-8", cat:"需求表達", prompt:"想喝水,你可以怎麼說?", options:["我可以喝水嗎","我不要"], correct:0 },
    { id:"school-basic-9", cat:"社交語用", prompt:"你想跟同學排隊,要排在誰後面?", options:["排在隊伍最後一個人後面","直接插到中間"], correct:0 },
    { id:"school-basic-10", cat:"社交語用", prompt:"同學說我不要跟你玩,你可以怎麼做?", options:["去找別的同學或安靜坐下","生氣打同學"], correct:0 },
    { id:"school-basic-11", cat:"情緒表達", prompt:"你想要安靜的角落,你可以說什麼?", options:["我想自己一個人待著","大聲尖叫"], correct:0 },
    { id:"school-basic-12", cat:"社交語用", prompt:"你看到同學在哭,你可以怎麼做?", options:["走過去關心他","笑他"], correct:0 },
    { id:"school-basic-13", cat:"社交語用", prompt:"老師問你聽懂了嗎,你不懂,你可以怎麼回答?", options:["我不懂","隨便點頭"], correct:0 },
    { id:"school-basic-14", cat:"社交語用", prompt:"同學跟你借剪刀用完後,他會怎麼做?", options:["還給我","自己留著"], correct:0 }
  ],
  mid: [
    { id:"school-mid-1", cat:"社交語用", prompt:"你想跟同學一起玩,你會說什麼?", options:["我可以一起玩嗎","走開啦"], correct:0 },
    { id:"school-mid-2", cat:"社交語用", prompt:"要排隊玩溜滑梯,你應該怎麼做?", options:["跟著大家排隊等","插到前面去"], correct:0 },
    { id:"school-mid-3", cat:"情緒表達", prompt:"你不喜歡這個遊戲,你可以怎麼說?", options:["我不喜歡這個遊戲","我要打人"], correct:0 },
    { id:"school-mid-4", cat:"社交語用", prompt:"同學借你蠟筆用,你會說什麼?", options:["太好了,謝謝","笨死了"], correct:0 },
    { id:"school-mid-5", cat:"需求表達", prompt:"你想要老師再說一次,你會說什麼?", options:["老師可以再說一次嗎","我不懂,算了"], correct:0 },
    { id:"school-mid-6", cat:"情緒表達", prompt:"有人碰到你,你不喜歡,你會說什麼?", options:["請不要碰我","什麼都不說,直接推他"], correct:0 },
    { id:"school-mid-7", cat:"社交語用", prompt:"同學說要一起玩,你也想玩,你會說什麼?", options:["好啊,我也想玩","我才不要"], correct:0 },
    { id:"school-mid-8", cat:"情緒表達", prompt:"你今天很累不想玩遊戲,你會說什麼?", options:["我今天有點累,想休息一下","不理任何人"], correct:0 },
    { id:"school-mid-9", cat:"社交語用", prompt:"你想跟同學一起排隊玩溜滑梯,你會說什麼?", options:["我可以一起排隊嗎","讓開啦"], correct:0 },
    { id:"school-mid-10", cat:"情緒表達", prompt:"你不喜歡有人碰你的東西,你會怎麼說?", options:["請不要碰我的東西","直接打他的手"], correct:0 },
    { id:"school-mid-11", cat:"社交語用", prompt:"同學一直插隊,你可以怎麼說?", options:["請排隊,不要插隊","什麼都不說,自己生氣"], correct:0 },
    { id:"school-mid-12", cat:"社交語用", prompt:"你想要換一個遊戲玩,你會說什麼?", options:["我們可以玩別的遊戲嗎","我不玩了"], correct:0 },
    { id:"school-mid-13", cat:"情緒表達", prompt:"你覺得教室太吵,你會怎麼說?", options:["這裡太吵了,我可以去安靜的地方嗎","摀住耳朵尖叫"], correct:0 },
    { id:"school-mid-14", cat:"社交語用", prompt:"同學一直看著你不說話,你會怎麼做?", options:["主動問他要不要一起玩","低頭不理他"], correct:0 }
  ],
  causal: [
    { id:"school-causal-1", cat:"因果關係", prompt:"小安在排隊的時候插隊,後面的同學會有什麼感覺?", options:["生氣","開心"], correct:0 },
    { id:"school-causal-2", cat:"因果關係", prompt:"你跟同學說可以一起玩嗎,同學說好,接下來會發生什麼事?", options:["兩個人可以一起玩","沒辦法一起玩"], correct:0 },
    { id:"school-causal-3", cat:"因果關係", prompt:"因為你告訴同學你不喜歡這個遊戲,所以他可能會怎麼做?", options:["換一個大家都喜歡的遊戲","對我生氣"], correct:0 },
    { id:"school-causal-4", cat:"因果關係", prompt:"同學一直搶你的玩具,你跟老師說了,所以老師會怎麼做?", options:["幫忙處理,提醒同學要輪流","什麼都不管"], correct:0 },
    { id:"school-causal-5", cat:"因果關係", prompt:"因為你排隊排得很整齊,所以你會比較快輪到什麼?", options:["玩到溜滑梯","被叫去罰站"], correct:0 },
    { id:"school-causal-6", cat:"因果關係", prompt:"你直接搶了同學的畫筆,所以同學的心情會怎麼樣?", options:["難過或生氣","很開心"], correct:0 },
    { id:"school-causal-7", cat:"因果關係", prompt:"你跟同學說謝謝之後,同學下次可能會怎麼做?", options:["更願意再借我東西","以後都不理我"], correct:0 },
    { id:"school-causal-8", cat:"因果關係", prompt:"因為你先問可以跟他一起玩嗎,所以比較容易發生什麼事?", options:["順利一起玩","被拒絕生氣"], correct:0 },
    { id:"school-causal-9", cat:"因果關係", prompt:"因為你排隊排得很好,老師稱讚了你,所以你的心情會怎麼樣?", options:["開心","難過"], correct:0 },
    { id:"school-causal-10", cat:"因果關係", prompt:"你告訴同學我不喜歡被打斷,所以同學接下來可能會怎麼做?", options:["說話前先等我講完","繼續打斷我"], correct:0 },
    { id:"school-causal-11", cat:"因果關係", prompt:"同學一直插隊,大家都在等,所以隊伍會變得怎麼樣?", options:["大家心情不好、隊伍變亂","大家都很開心"], correct:0 },
    { id:"school-causal-12", cat:"因果關係", prompt:"因為你先跟同學說我可以加入嗎,所以同學比較容易怎麼回答?", options:["好啊,一起玩","直接說不要"], correct:0 },
    { id:"school-causal-13", cat:"因果關係", prompt:"你今天很累,跟老師說了,所以老師會怎麼做?", options:["讓我休息一下","要求我繼續跑跳"], correct:0 },
    { id:"school-causal-14", cat:"因果關係", prompt:"因為你安慰了哭泣的同學,所以他的心情會怎麼樣?", options:["慢慢變好","更難過"], correct:0 }
  ]
};
const SESSION_LENGTH = 8;

const levelInfo = {
  basic: { label: "基礎", desc: "標記與聽指令" },
  mid: { label: "中階", desc: "情境選詞、表達句" },
  causal: { label: "進階", desc: "因果關係推理句" }
};

let progress = { totalStars: 0, masteredIds: [], lastPlayed: null };
let level = null, questions = [], idx = 0, score = 0, answered = false, correctFlags = [];

async function loadProgress(){
  try {
    const saved = localStorage.getItem('progress:school:' + CHILD_ID);
    if(saved) progress = JSON.parse(saved);
  } catch(e) {}
}
async function saveProgress(){
  try {
    progress.lastPlayed = new Date().toISOString();
    localStorage.setItem('progress:school:' + CHILD_ID, JSON.stringify(progress));
  } catch(e) {}
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleOptions(q){
  const order = shuffle(q.options.map((_,i) => i));
  return { ...q, options: order.map(i => q.options[i]), correct: order.indexOf(q.correct) };
}
function pickQuestions(lv){
  const pool = BANK[lv];
  const fresh = shuffle(pool.filter(q => progress.masteredIds.indexOf(q.id) === -1));
  let picked = fresh.slice(0, SESSION_LENGTH);
  if(picked.length < SESSION_LENGTH){
    const need = SESSION_LENGTH - picked.length;
    const already = new Set(picked.map(q => q.id));
    const rest = shuffle(pool.filter(q => !already.has(q.id))).slice(0, need);
    picked = picked.concat(rest);
  }
  return picked.slice(0, Math.min(SESSION_LENGTH, pool.length)).map(shuffleOptions);
}

function speak(text){
  const fb = document.getElementById('feedback');
  if(!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)){
    if(fb){
      fb.textContent = '此瀏覽器不支援語音，請改用 Safari 或 Chrome 開啟';
      fb.style.color = 'var(--warning-text)';
    }
    return;
  }
  const synth = window.speechSynthesis;
  synth.cancel();
  synth.resume();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW'; u.rate = 0.82; u.volume = 1;
  const voices = synth.getVoices();
  const zhVoice = voices.find(v => /^zh-TW/i.test(v.lang))
    || voices.find(v => /^zh/i.test(v.lang));
  if(zhVoice) u.voice = zhVoice;
  const p = document.getElementById('promptText');
  if(p){ u.onstart = () => p.style.background = 'var(--accent-bg)'; u.onend = () => p.style.background = 'transparent'; }
  u.onerror = () => {
    if(fb){
      fb.textContent = '語音播放失敗，請用 Safari 或 Chrome 開啟並確認媒體音量';
      fb.style.color = 'var(--warning-text)';
    }
  };
  synth.speak(u);
}

function renderLevelSelect(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <p style="font-size:16px; color:var(--text-muted); margin:16px 0 6px;">睿睿目前累積星星:${progress.totalStars} 顆</p>
    <p style="font-size:16px; margin:0 0 1.5rem;">選擇今天的練習難度(學校社交主題)</p>
    <div style="display:flex; flex-direction:column; gap:12px;">
      ${Object.keys(levelInfo).map(k => `
        <button data-k="${k}" class="levelBtn" style="text-align:left; padding:16px 18px; display:flex; flex-direction:column; gap:2px;">
          <span style="font-size:17px; font-weight:600;">${levelInfo[k].label}</span>
          <span style="font-size:13px; color:var(--text-muted);">${levelInfo[k].desc}</span>
        </button>`).join('')}
    </div>`;
  document.querySelectorAll('.levelBtn').forEach(btn => {
    btn.onclick = () => {
      level = btn.dataset.k;
      questions = pickQuestions(level);
      idx = 0; score = 0; correctFlags = [];
      renderQuestion();
    };
  });
}

function starBadge(filled){
  return filled
    ? `<div style="width:34px;height:34px;border-radius:50%;background:var(--warning-bg);display:flex;align-items:center;justify-content:center;font-size:18px;">★</div>`
    : `<div style="width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--border);">★</div>`;
}

async function renderQuestion(){
  const app = document.getElementById('app');
  if(idx >= questions.length){
    questions.forEach((q,i) => { if(correctFlags[i] && progress.masteredIds.indexOf(q.id) === -1) progress.masteredIds.push(q.id); });
    progress.totalStars += score;
    await saveProgress();
    const ratio = score / questions.length;
    const msg = ratio === 1 ? "全部集滿了,你是語言小超人!"
      : ratio >= 0.6 ? "集了好多星星,你好棒!"
      : "又前進了一步,繼續加油!";
    app.innerHTML = `
      <p style="font-size:22px; font-weight:600; margin:2rem 0 4px;">睿睿的集點卡</p>
      <p style="font-size:15px; color:var(--text-muted); margin:0 0 20px;">${levelInfo[level].label}難度・累積總星數 ${progress.totalStars}</p>
      <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:0 0 20px;">
        ${correctFlags.map(f => starBadge(f)).join('')}
      </div>
      <p style="font-size:17px; font-weight:600; color:var(--warning-text); margin:0 0 24px;">${msg}</p>
      <div style="display:flex; gap:10px; justify-content:center; padding-bottom:2rem;">
        <button id="retry" style="padding:12px 22px; font-size:15px;">再玩一次</button>
        <button id="changeLevel" style="padding:12px 22px; font-size:15px;">換難度</button>
      </div>`;
    document.getElementById('retry').onclick = () => { questions = pickQuestions(level); idx = 0; score = 0; correctFlags = []; renderQuestion(); };
    document.getElementById('changeLevel').onclick = renderLevelSelect;
    return;
  }
  const q = questions[idx];
  answered = false;
  const dots = questions.map((_,i) => `<div style="width:10px;height:10px;border-radius:50%;background:${i<idx?'var(--accent)':i===idx?'var(--text)':'var(--border)'};"></div>`).join('');
  app.innerHTML = `
    <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin:1rem 0 0.75rem;">
      <span style="font-size:12px; color:var(--text-muted);">${levelInfo[level].label}難度</span>
      <span style="font-size:13px; font-weight:600; color:var(--warning-text);">★ ${score}</span>
    </div>
    <div style="display:flex; gap:6px; justify-content:center; margin-bottom:1.5rem;">${dots}</div>
    <div class="badge">${q.cat}</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:2rem;">
      <button id="speakBtn" aria-label="播放題目語音" style="width:56px; height:56px; border-radius:50%; padding:0; font-size:24px;">🔊</button>
      <p id="promptText" style="font-size:18px; font-weight:600; margin:0; padding:6px 10px; border-radius:6px; transition:background 0.2s;">${q.prompt}</p>
    </div>
    <p style="font-size:13px; color:var(--text-muted); margin:-1.25rem 0 1.5rem;">點一下喇叭播放題目</p>
    <div id="options" style="display:flex; flex-direction:column; gap:14px;">
      ${q.options.map((opt,i) => `<button data-i="${i}" class="optBtn" style="height:64px; font-size:18px;">${opt}</button>`).join('')}
    </div>
    <div id="feedback" style="min-height:32px; margin-top:1.25rem; font-size:16px; font-weight:600;"></div>
    <button id="nextBtn" style="margin-top:0.5rem; padding:10px 24px; font-size:15px; display:none;">下一題</button>
    <div style="height:2rem;"></div>`;

  document.getElementById('speakBtn').onclick = () => speak(q.prompt);
  document.querySelectorAll('.optBtn').forEach(btn => {
    btn.onclick = () => {
      if(answered) return;
      answered = true;
      const i = Number(btn.dataset.i);
      const fb = document.getElementById('feedback');
      const correctBtn = document.querySelectorAll('.optBtn')[q.correct];
      const isCorrect = i === q.correct;
      correctFlags.push(isCorrect);
      if(isCorrect){
        score++;
        btn.style.borderColor = 'var(--success)';
        btn.style.background = 'var(--success-bg)';
        fb.textContent = '答對了,獲得一顆星星!';
        fb.style.color = 'var(--success)';
        speak('答對了,獲得一顆星星!');
      } else {
        btn.style.borderColor = 'var(--warning-text)';
        correctBtn.style.borderColor = 'var(--success)';
        correctBtn.style.background = 'var(--success-bg)';
        fb.textContent = '再想一次也沒關係';
        fb.style.color = 'var(--warning-text)';
        speak('再想一次也沒關係');
      }
      document.getElementById('nextBtn').style.display = 'inline-block';
    };
  });
  document.getElementById('nextBtn').onclick = () => { idx++; renderQuestion(); };
}

(async function init(){
  await loadProgress();
  renderLevelSelect();
})();
</script>
</body>
</html>
